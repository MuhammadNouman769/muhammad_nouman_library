{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ page_title|default:"All Books" }}{% endblock %}

{% block content %}
<div class="container py-5">
  <h1 class="section-title">{{ page_title|default:"All Books" }}</h1>
  <p class="section-sub"><span id="resultCount">{{ page_obj.paginator.count }}</span> {% trans "books found" %}</p>

  <div class="row g-4">
    <div class="col-lg-3">
      <form id="bookFilterForm" data-base-url="{% url 'books:list' %}" class="filters-bar">
        <div class="mb-3">
          <label class="form-label fw-semibold small">{% trans "Search" %}</label>
          <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="{% trans 'Title, author...' %}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">{% trans "Category" %}</label>
          <select name="category" class="form-select">
            <option value="">{% trans "All Categories" %}</option>
            {% for cat in nav_categories %}<option value="{{ cat.slug }}">{{ cat.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">{% trans "Language" %}</label>
          <select name="language" class="form-select">
            <option value="">{% trans "All Languages" %}</option>
            <option value="en">English</option>
            <option value="ur">Urdu</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">{% trans "Price" %}</label>
          <select name="price" class="form-select">
            <option value="">{% trans "All" %}</option>
            <option value="free">{% trans "Free" %}</option>
            <option value="paid">{% trans "Paid" %}</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold small">{% trans "Sort by" %}</label>
          <select name="sort" class="form-select">
            <option value="latest">{% trans "Latest" %}</option>
            <option value="popular">{% trans "Popular" %}</option>
            <option value="price_low">{% trans "Price: Low to High" %}</option>
            <option value="price_high">{% trans "Price: High to Low" %}</option>
            <option value="title">{% trans "Title A-Z" %}</option>
          </select>
        </div>
      </form>
    </div>
    <div class="col-lg-9">
      <div id="bookGrid">
        {% include "books/_book_grid.html" %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
