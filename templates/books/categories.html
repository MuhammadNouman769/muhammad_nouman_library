{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Categories" %}{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="section-title">{% trans "Categories" %}</h1>
  <p class="section-sub">{% trans "Explore books by category" %}</p>
  <div class="row g-3">
    {% for cat in categories %}
    <div class="col-6 col-md-3">
      <a href="{{ cat.get_absolute_url }}" class="category-chip">
        <span class="icon"><i class="bi {{ cat.icon|default:'bi-book' }}"></i></span>
        <span>
          <div class="fw-semibold small">{{ cat.name }}</div>
          <div class="text-muted" style="font-size:.72rem;">{{ cat.book_count }} {% trans "books" %}</div>
        </span>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
