{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "FAQ" %}{% endblock %}
{% block content %}
<div class="container py-5">
  <h1 class="section-title">{% trans "Frequently Asked Questions" %}</h1>
  <div class="accordion" id="faqAccordion" style="max-width:800px;">
    {% for q, a in faqs %}
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ forloop.counter }}">
          {{ q }}
        </button>
      </h2>
      <div id="faq{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" data-bs-parent="#faqAccordion">
        <div class="accordion-body text-muted">{{ a }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
