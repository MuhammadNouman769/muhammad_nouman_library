{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Order Confirmed" %}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <i class="bi bi-check-circle-fill text-success" style="font-size:4rem;"></i>
  <h1 class="fw-bold mt-3">{% trans "Thank you! Your order is confirmed." %}</h1>
  <p class="text-muted">{% trans "Order number" %}: <strong>{{ order.order_number }}</strong></p>
  <a href="{% url 'orders:detail' order.id %}" class="btn mnl-btn-accent mt-2">{% trans "View Order" %}</a>
</div>
{% endblock %}
